user  nginx;
worker_processes  auto;
worker_rlimit_nofile 8192;

error_log  /var/log/nginx/error.log warn;
pid        /var/run/nginx.pid;

events {
    worker_connections  2048;
    multi_accept        on;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    log_format  main  '$remote_addr - $host [$time_local] "$request" '
                      '$status $body_bytes_sent "$http_referer" '
                      '"$http_user_agent" "$http_x_forwarded_for" '
                      'rt=$request_time cache=$upstream_cache_status';

    access_log  /var/log/nginx/access.log  main;

    sendfile            on;
    tcp_nopush          on;
    tcp_nodelay         on;
    keepalive_timeout   75;
    keepalive_requests  1000;
    types_hash_max_size 2048;
    server_tokens       off;

    open_file_cache          max=1000 inactive=60s;
    open_file_cache_valid    30s;
    open_file_cache_min_uses 2;
    open_file_cache_errors   on;

    # TLS tuning for faster TTFB over long-distance connections
    ssl_protocols             TLSv1.2 TLSv1.3;
    ssl_ciphers               HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_cache         shared:SSL:10m;
    ssl_session_timeout       1d;
    ssl_session_tickets       on;
    ssl_buffer_size           4k;

    # Allow up to 25MB uploads for Admin Media Library
    client_max_body_size 25M;

    # Proxy buffer & timeout tuning
    proxy_buffers           16 16k;
    proxy_buffer_size       16k;
    proxy_busy_buffers_size 32k;

    # Gzip Compression for HTML, JSON APIs, CSS, JS, Fonts, SVG
    gzip              on;
    gzip_vary         on;
    gzip_proxied      any;
    gzip_comp_level   6;
    gzip_min_length   512;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/javascript
        application/x-javascript
        application/json
        application/xml
        application/rss+xml
        application/font-woff2
        font/woff2
        image/svg+xml;

    # Shared Disk/RAM Caches for MinIO Media & Read-Only Public APIs
    proxy_cache_path /var/cache/nginx/media levels=1:2 keys_zone=media_cache:20m max_size=1g inactive=30d use_temp_path=off;
    proxy_cache_path /var/cache/nginx/api   levels=1:2 keys_zone=api_cache:20m   max_size=256m inactive=10m use_temp_path=off;

    # Rate limit protection against login / 2FA brute-force
    limit_req_zone $binary_remote_addr zone=auth_limit:10m rate=10r/m;

    # WebSocket connection upgrade helper
    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    # Preserve original scheme when sitting behind Cloudflare SSL proxy
    map $http_x_forwarded_proto $proxy_x_forwarded_proto {
        default $http_x_forwarded_proto;
        ''      $scheme;
    }

    include /etc/nginx/conf.d/*.conf;
}
