# =============================================================================
# Local Gateway Config: heygoodly (HTTP :80 + Self-Signed HTTPS :443)
# Trên VPS thật, chạy ./scripts/enable-vps-ssl.sh để kích hoạt Let's Encrypt
# =============================================================================
server {
    listen 80 default_server;
    server_name heygoodly.localhost localhost _;

    resolver 127.0.0.11 valid=10s ipv6=off;
    set $site_backend heygoodly-backend;
    set $site_frontend heygoodly-frontend;
    set $site_proto $proxy_x_forwarded_proto;

    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    include /etc/nginx/snippets/site-locations.conf;
}

server {
    listen 443 ssl default_server;
    http2 on;
    server_name heygoodly.localhost localhost _;

    ssl_certificate /etc/nginx/ssl/selfsigned.crt;
    ssl_certificate_key /etc/nginx/ssl/selfsigned.key;

    resolver 127.0.0.11 valid=10s ipv6=off;
    set $site_backend heygoodly-backend;
    set $site_frontend heygoodly-frontend;
    set $site_proto https;

    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    include /etc/nginx/snippets/site-locations.conf;
}
