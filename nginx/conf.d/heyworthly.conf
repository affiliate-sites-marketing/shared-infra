# =============================================================================
# Gateway Config: HeyWorthly
# - HTTP:  :81   (http://VPS_IP:81   hoặc http://localhost:81 / http://heyworthly.localhost / http://heyworthly.com)
# - HTTPS: :8443 (https://VPS_IP:8443 hoặc https://localhost:8443 — Self-Signed SSL)
# =============================================================================
server {
    listen 81 default_server;
    listen 80;
    server_name heyworthly.localhost heyworthly.com www.heyworthly.com;

    resolver 127.0.0.11 valid=10s ipv6=off;
    set $site_backend heyworthly-backend;
    set $site_frontend heyworthly-frontend;
    set $site_proto $proxy_x_forwarded_proto;

    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    include /etc/nginx/snippets/site-locations.conf;
}

server {
    listen 8443 ssl default_server;
    listen 443 ssl;
    http2 on;
    server_name heyworthly.localhost heyworthly.com www.heyworthly.com;

    ssl_certificate /etc/nginx/ssl/selfsigned.crt;
    ssl_certificate_key /etc/nginx/ssl/selfsigned.key;

    resolver 127.0.0.11 valid=10s ipv6=off;
    set $site_backend heyworthly-backend;
    set $site_frontend heyworthly-frontend;
    set $site_proto https;

    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    include /etc/nginx/snippets/site-locations.conf;
}
