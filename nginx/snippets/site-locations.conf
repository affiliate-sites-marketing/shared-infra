# =============================================================================
# Shared Site Location Rules (included by heygoodly.conf & bestora.conf)
# Requires server block to set: $site_backend, $site_frontend, $site_proto
# =============================================================================

location /.well-known/acme-challenge/ {
    root /var/www/certbot;
}

# Rate-limited Auth Endpoints (no caching)
location ~ ^/api/v1/auth/(login|verify-2fa)$ {
    limit_req zone=auth_limit burst=10 nodelay;
    set $backend_upstream http://${site_backend}:8080;
    proxy_pass $backend_upstream;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $http_host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $site_proto;
}

# Micro-cache 15s for read-only public catalog APIs (excludes /geo and authenticated requests)
location ~ ^/api/v1/(public/)?(menus|categories|pages|tags|stores|posts|offers|deals|coupons)(/.*)?$ {
    set $backend_upstream http://${site_backend}:8080;
    proxy_pass $backend_upstream;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $http_host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $site_proto;

    proxy_cache api_cache;
    proxy_cache_key "$scheme$http_host$request_uri";
    proxy_cache_valid 200 15s;
    proxy_cache_lock on;
    proxy_cache_use_stale error timeout updating http_500 http_502 http_503 http_504;
    proxy_cache_bypass $http_authorization;
    proxy_no_cache $http_authorization;
    add_header X-Cache-Status $upstream_cache_status always;
}

# All other API routes (Admin, Auth, GeoIP, Mutations — uncached)
location /api/ {
    client_max_body_size 25M;
    set $backend_upstream http://${site_backend}:8080;
    proxy_pass $backend_upstream;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $http_host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $site_proto;
    proxy_read_timeout 60s;
    proxy_connect_timeout 10s;
}

# Cached Shared MinIO Media Proxy (/media/<bucket>/<objectKey>)
location ~ ^/media/(.*)$ {
    set $minio_upstream http://shared-minio:9000/$1$is_args$args;
    proxy_pass $minio_upstream;
    proxy_http_version 1.1;
    proxy_set_header Host $http_host;
    proxy_set_header Connection "";

    proxy_cache media_cache;
    proxy_cache_key "$request_uri";
    proxy_cache_valid 200 30d;
    proxy_cache_lock on;
    proxy_cache_use_stale error timeout updating http_500 http_502 http_503 http_504;
    proxy_ignore_headers Set-Cookie;

    add_header Cache-Control "public, max-age=31536000, immutable";
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Cache-Status $upstream_cache_status always;
}

# Next.js immutable hashed assets
location /_next/static/ {
    set $frontend_upstream http://${site_frontend}:3000;
    proxy_pass $frontend_upstream;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $http_host;
    add_header Cache-Control "public, max-age=31536000, immutable";
    add_header X-Content-Type-Options "nosniff" always;
}

# Next.js SSR & App Routes
location / {
    set $frontend_upstream http://${site_frontend}:3000;
    proxy_pass $frontend_upstream;
    proxy_http_version 1.1;
    proxy_set_header Host $http_host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $site_proto;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_read_timeout 60s;
}
