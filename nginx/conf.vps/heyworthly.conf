# =============================================================================
# VPS Production Config: heyworthly (Domain https://heyworthly.com - Let's Encrypt)
# Kích hoạt bằng: ./scripts/enable-vps-ssl.sh admin@heyworthly.com heyworthly.com
# =============================================================================

# 1. HTTP Domain -> Redirect HTTPS (giữ ACME open để auto-renew)
server {
    listen 80;
    server_name heyworthly.com www.heyworthly.com;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://heyworthly.com$request_uri;
    }
}

# 2. HTTPS www -> Redirect Canonical https://heyworthly.com
server {
    listen 443 ssl;
    http2 on;
    server_name www.heyworthly.com;

    ssl_certificate /etc/letsencrypt/live/heyworthly.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/heyworthly.com/privkey.pem;

    return 301 https://heyworthly.com$request_uri;
}

# 3. HTTPS Primary Canonical: https://heyworthly.com
server {
    listen 443 ssl;
    http2 on;
    server_name heyworthly.com;

    ssl_certificate /etc/letsencrypt/live/heyworthly.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/heyworthly.com/privkey.pem;

    resolver 127.0.0.11 valid=10s ipv6=off;
    set $site_backend heyworthly-backend;
    set $site_frontend heyworthly-frontend;
    set $site_proto https;

    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    include /etc/nginx/snippets/site-locations.conf;
}

# 4. Fallback HTTP :81 & HTTPS Self-Signed :8443 (truy cập dự phòng qua VPS IP)
server {
    listen 81 default_server;
    server_name heyworthly.localhost _;

    resolver 127.0.0.11 valid=10s ipv6=off;
    set $site_backend heyworthly-backend;
    set $site_frontend heyworthly-frontend;
    set $site_proto $proxy_x_forwarded_proto;

    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    include /etc/nginx/snippets/site-locations.conf;
}

server {
    listen 8443 ssl default_server;
    http2 on;
    server_name heyworthly.localhost _;

    ssl_certificate /etc/nginx/ssl/selfsigned.crt;
    ssl_certificate_key /etc/nginx/ssl/selfsigned.key;

    resolver 127.0.0.11 valid=10s ipv6=off;
    set $site_backend heyworthly-backend;
    set $site_frontend heyworthly-frontend;
    set $site_proto https;

    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    include /etc/nginx/snippets/site-locations.conf;
}
