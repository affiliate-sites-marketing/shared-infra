# =============================================================================
# VPS Production Config: heygoodly (Domain https://heygoodly.com - Let's Encrypt)
# Kích hoạt bằng: ./scripts/enable-vps-ssl.sh heygoodly.com
# =============================================================================

# 1. HTTP Domain -> Redirect HTTPS (giữ ACME open để auto-renew)
server {
    listen 80;
    server_name heygoodly.com www.heygoodly.com;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://heygoodly.com$request_uri;
    }
}

# 2. HTTP Fallback cho Raw Server IP
server {
    listen 80 default_server;
    server_name _;

    resolver 127.0.0.11 valid=10s ipv6=off;
    set $site_backend heygoodly-backend;
    set $site_frontend heygoodly-frontend;
    set $site_proto $proxy_x_forwarded_proto;

    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    include /etc/nginx/snippets/site-locations.conf;
}

# 3. HTTPS www -> Redirect Canonical https://heygoodly.com
server {
    listen 443 ssl;
    http2 on;
    server_name www.heygoodly.com;

    ssl_certificate /etc/letsencrypt/live/heygoodly.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/heygoodly.com/privkey.pem;

    return 301 https://heygoodly.com$request_uri;
}

# 4. HTTPS Primary Canonical: https://heygoodly.com
server {
    listen 443 ssl;
    http2 on;
    server_name heygoodly.com;

    ssl_certificate /etc/letsencrypt/live/heygoodly.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/heygoodly.com/privkey.pem;

    resolver 127.0.0.11 valid=10s ipv6=off;
    set $site_backend heygoodly-backend;
    set $site_frontend heygoodly-frontend;
    set $site_proto https;

    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    include /etc/nginx/snippets/site-locations.conf;
}

# 5. HTTPS Self-Signed Fallback cho Raw Server IP
server {
    listen 443 ssl default_server;
    http2 on;
    server_name _;

    ssl_certificate /etc/nginx/ssl/selfsigned.crt;
    ssl_certificate_key /etc/nginx/ssl/selfsigned.key;

    resolver 127.0.0.11 valid=10s ipv6=off;
    set $site_backend heygoodly-backend;
    set $site_frontend heygoodly-frontend;
    set $site_proto https;

    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    include /etc/nginx/snippets/site-locations.conf;
}
