# =============================================================================
# Shared Nginx Reverse Proxy Gateway + Certbot Auto-Renew SSL
# - heygoodly:  :80/:443 (https://heygoodly.com)
# - heyworthly: :80/:443 (https://heyworthly.com) + fallback :81/:8443
# - certbot:    Kiểm tra gia hạn mỗi 7 ngày (4 lần retry trong cửa sổ 30 ngày)
# - nginx:      Chỉ reload khi certbot thực sự gia hạn cert mới (~6 lần/năm)
# =============================================================================
name: shared-gateway

x-logging: &default-logging
  driver: "json-file"
  options:
    max-size: "10m"
    max-file: "3"

services:
  nginx:
    image: nginx:1.27-alpine
    container_name: shared-nginx
    restart: unless-stopped
    mem_limit: 192m
    logging: *default-logging
    command: ["/bin/sh", "-c", "last=$$(cat /var/www/certbot/.ssl-renewed 2>/dev/null || true); while :; do sleep 86400 & wait $$!; cur=$$(cat /var/www/certbot/.ssl-renewed 2>/dev/null || true); if [ -n \"$$cur\" ] && [ \"$$cur\" != \"$$last\" ]; then nginx -t && nginx -s reload && last=\"$$cur\"; fi; done & exec nginx -g 'daemon off;'"]
    ports:
      - "${NGINX_HEYGOODLY_PORT:-80}:80"
      - "${NGINX_HEYWORTHLY_PORT:-81}:81"
      - "${NGINX_HTTPS_PORT:-443}:443"
      - "${NGINX_HEYWORTHLY_HTTPS_PORT:-8443}:8443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      - ./nginx/snippets:/etc/nginx/snippets:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
      - ./nginx/certbot/www:/var/www/certbot:ro
      - ./nginx/certbot/conf:/etc/letsencrypt:ro
      - nginx_logs:/var/log/nginx
      - nginx_cache:/var/cache/nginx
    networks:
      - shared-gateway-net
      - shared-minio-net
    healthcheck:
      test: ["CMD-SHELL", "nginx -t || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3

  certbot:
    image: certbot/certbot:latest
    container_name: shared-certbot
    restart: unless-stopped
    mem_limit: 128m
    logging: *default-logging
    volumes:
      - ./nginx/certbot/www:/var/www/certbot
      - ./nginx/certbot/conf:/etc/letsencrypt
    entrypoint: ["/bin/sh", "-c", "trap exit TERM; while :; do certbot renew --webroot -w /var/www/certbot --deploy-hook 'date +%s > /var/www/certbot/.ssl-renewed' --quiet || true; sleep 604800 & wait $$!; done"]
    healthcheck:
      test: ["CMD-SHELL", "test -d /etc/letsencrypt && test -d /var/www/certbot"]
      interval: 60s
      timeout: 5s
      retries: 3

volumes:
  nginx_logs:
    name: shared_nginx_logs
  nginx_cache:
    name: shared_nginx_cache

networks:
  shared-gateway-net:
    external: true
    name: shared-gateway-net
  shared-minio-net:
    external: true
    name: shared-minio-net
