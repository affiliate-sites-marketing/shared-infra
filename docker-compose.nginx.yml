# =============================================================================
# Shared Nginx Reverse Proxy Gateway
# - heygoodly: :80 (HTTP) & :443 (HTTPS)
# - bestora:   :81 (HTTP) & :8443 (HTTPS Self-Signed, không cần domain)
# =============================================================================
name: shared-gateway

services:
  nginx:
    image: nginx:1.27-alpine
    container_name: shared-nginx
    restart: unless-stopped
    ports:
      - "${NGINX_HEYGOODLY_PORT:-80}:80"
      - "${NGINX_BESTORA_PORT:-81}:81"
      - "${NGINX_HTTPS_PORT:-443}:443"
      - "${NGINX_BESTORA_HTTPS_PORT:-8443}:8443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      - ./nginx/snippets:/etc/nginx/snippets:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
      - ./nginx/certbot/www:/var/www/certbot:ro
      - ./nginx/certbot/conf:/etc/letsencrypt:ro
      - nginx_logs:/var/log/nginx
      - nginx_cache:/var/cache/nginx
    networks:
      - shared-gateway-net
      - shared-minio-net
    healthcheck:
      test: ["CMD-SHELL", "nginx -t || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3

volumes:
  nginx_logs:
    name: shared_nginx_logs
  nginx_cache:
    name: shared_nginx_cache

networks:
  shared-gateway-net:
    external: true
    name: shared-gateway-net
  shared-minio-net:
    external: true
    name: shared-minio-net
